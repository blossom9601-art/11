<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>blossom</title>
    <link rel="icon" type="image/png" href="/static/image/svg/favicon/free-icon-bold-5090971.svg">
    <link rel="shortcut icon" type="image/png" href="/static/image/svg/favicon/free-icon-bold-5090971.svg">
    <link rel="apple-touch-icon" href="/static/image/svg/favicon/free-icon-bold-5090971.svg">
    <link rel="stylesheet" href="/static/css/blossom.css?v=1.2.6">
    <link rel="stylesheet" href="/static/css/center.css?v=20260515_modal_uniform1">
</head>
<body>
    {% include 'layouts/_header.html' %}
    {% include 'layouts/_sidebar.html' %}

    <main class="main-content">
        <div class="content-wrapper">
            <div class="page-header">
                <div class="page-utility-right" data-info-key="datacenter.ups"></div>
                <h1>UPS 관리</h1>
                <p>UPS 페이지 확장을 위한 기본 탭입니다.</p>
            </div>

            <div id="dynamic-system-tabs"
                 data-page-code="DC_UPS"
                 data-current-key="{{ current_key }}"
                 data-aria-label="UPS 관리 탭"></div>

            <div class="tab-content single-pane">
                <div class="tab-pane active" id="system-list-pane">
                    <div class="tab-header">
                        <div class="tab-header-left"><h2>UPS1</h2></div>
                    </div>
                    <div id="system-empty" class="system-empty" role="status" aria-live="polite">
                        <div class="empty-illustration"><img src="/static/image/svg/list/free-icon-not-available.svg" alt="데이터 없음" class="empty-icon-img" loading="lazy"></div>
                        <div class="empty-text"><h3>UPS1 페이지가 준비되었습니다.</h3><p>설정 &gt; 페이지관리를 통해 이 탭을 확장할 수 있습니다.</p></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/blossom.js?v=20260513_rack_nav1"></script>
    <script src="/static/js/common/page_tab_renderer.js?v=20260501_fouc1"></script>
    <script src="/static/js/common/info-message-v2.js?v=20260413e"></script>
</body>
</html>
