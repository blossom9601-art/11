<!-- Critical shell CSS: 외부 CSS가 늦어도 헤더/사이드바/스켈레톤 레이아웃을 먼저 고정 -->
<style id="bls-critical-shell-css">
html,body{margin:0!important;padding:0!important;min-height:100%;background:#f9fafb;}
.main-header{height:56px;min-height:56px;margin:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid #e5e7eb;box-sizing:border-box;}
.header-left,.header-right,.header-center,.header-search-form{display:flex;align-items:center;}
.header-left{gap:12px;}.header-right{gap:8px;}.header-center{flex:1;justify-content:center;padding:0 18px;}.header-search-form{width:min(100%,560px);gap:8px;}
.header-logo{height:34px;}.system-title{margin:0;font-size:1.35rem;font-weight:700;color:#374151;}.system-subtitle{display:none;}
.header-search-input{width:100%;height:36px;border:1px solid #d1d5db;border-radius:12px;padding:0 14px;box-sizing:border-box;background:#fff;color:#111827;}
.header-btn{position:relative;border:0;background:transparent;border-radius:8px;padding:8px;color:#4b5563;cursor:pointer;}
.header-icon{width:20px;height:20px;display:block;}.header-avatar-icon{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block;}
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:#fff;border-right:1px solid #f1f5f9;z-index:200;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;}
.sidebar-menu{padding:72px 0 16px;box-sizing:border-box;}.menu-list{list-style:none;margin:0;padding:0;}.menu-link{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#64748b;text-decoration:none;font-size:.85rem;font-weight:500;box-sizing:border-box;}.submenu{list-style:none;margin:0;padding:0;max-height:0;overflow:hidden;background:#f8fafc;}.menu-item.open .submenu{max-height:1000px;}.submenu-link{display:block;padding:8px 20px 8px 52px;color:#64748b;text-decoration:none;font-size:.8rem;}
.menu-icon{width:18px;height:18px;flex-shrink:0;}.submenu-arrow{width:14px;height:14px;margin-left:auto;flex-shrink:0;}.bls-inline-icon{display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:currentColor;filter:none!important;}
.main-content{margin-left:260px;height:calc(100vh - 56px);padding:0 24px;background:#f9fafb;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;position:relative;min-height:360px;}
.spa-skeleton{padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-sizing:border-box;}.spa-skeleton-bar{height:18px;border-radius:6px;background:#eef2f7;}.spa-skeleton-bar.short{height:14px;}
body:not(.bls-ready) main.main-content:not([data-spa-boot])>:not(.spa-skeleton):not(.bls-mount-skeleton),[data-bls-mounting="true"]>:not(.bls-mount-skeleton){visibility:hidden!important;}
</style>
<noscript><style>body main.main-content>*{visibility:visible!important}</style></noscript>

<!-- Chat unread badge polling -->
<script>
(function(){
  var POLL_MS = 5000;
  var btn = document.getElementById('btn-chat');
  if (!btn) return;
  function check(){
    fetch('/api/chat/unread-total', {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.total > 0) btn.classList.add('has-unread');
        else btn.classList.remove('has-unread');
      })
      .catch(function(){});
  }
  function start(){
    if (btn.__blsChatPollStarted) return;
    btn.__blsChatPollStarted = true;
    check();
    setInterval(check, POLL_MS);
  }
  if (document.body && document.body.classList.contains('bls-ready')) start();
  else document.addEventListener('blossom:ready', start, { once: true });
})();
</script>

<!-- Notification unread badge polling -->
<script>
(function(){
  var POLL_MS = 15000;
  var badge = document.getElementById('noti-badge');
  if (!badge) return;
  function check(){
    fetch('/api/notifications/unread-count', {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.success && d.count > 0){
          badge.textContent = d.count > 10 ? '10+' : String(d.count);
          badge.classList.add('show');
        } else {
          badge.classList.remove('show');
          badge.textContent = '';
        }
      })
      .catch(function(){ badge.classList.remove('show'); badge.textContent = ''; });
  }
  function start(){
    if (badge.__blsNotiPollStarted) return;
    badge.__blsNotiPollStarted = true;
    check();
    setInterval(check, POLL_MS);
  }
  if (document.body && document.body.classList.contains('bls-ready')) start();
  else document.addEventListener('blossom:ready', start, { once: true });
})();
</script>

{% if current_key and current_key.startswith('hw_') %}
<script>
/* Hardware detail: backup sync — posts title/subtitle to Flask session.
   Primary mechanism is ?asset_id= query-param redirect (VPN pattern).
   This fires as fallback for direct-URL access or bookmarked pages. */
(function(){
  var _HW_SUFFIXES = ['_detail','_system','_contract','_hw','_sw','_backup',
    '_if','_account','_authority','_activate','_firewalld',
    '_storage','_task','_vulnerability','_package','_log','_file','_manager',
    '_hardware','_software','_component','_ip_range','_communication',
    '_vpn_policy','_frontbay','_rearbay','_basic','_assign'];
  var key = '{{ current_key }}';
  var baseKey = key;
  for(var i=0;i<_HW_SUFFIXES.length;i++){
    var s = _HW_SUFFIXES[i];
    if(key.length > s.length && key.substr(key.length - s.length) === s){
      baseKey = key.substr(0, key.length - s.length);
      break;
    }
  }
  function doSync(){
    try{
      var t = document.getElementById('page-title') || document.querySelector('.page-header h1');
      var sub = document.getElementById('page-subtitle') || document.querySelector('.page-header p');
      var title = t ? (t.textContent||'').trim() : '';
      var subtitle = sub ? (sub.textContent||'').trim() : '';
      if(!title || title === '-') return false;
      fetch('/api/_hw_session_sync', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'same-origin',
        body:JSON.stringify({base_key:baseKey, title:title, subtitle:subtitle||'-'})
      }).catch(function(){});
      return true;
    }catch(e){ return false; }
  }
  document.addEventListener('DOMContentLoaded', function(){
    /* Try immediately — if server already rendered real title, sync it */
    if(doSync()) return;
    /* Otherwise observe DOM for client JS to populate title */
    var el = document.getElementById('page-title') || document.querySelector('.page-header h1');
    if(!el) return;
    var obs = new MutationObserver(function(){
      if(doSync()){ obs.disconnect(); }
    });
    obs.observe(el, {childList:true, characterData:true, subtree:true});
    setTimeout(function(){ obs.disconnect(); }, 5000);
  });
})();
</script>
