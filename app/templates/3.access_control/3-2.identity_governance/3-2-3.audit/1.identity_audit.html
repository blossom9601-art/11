<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="google" content="notranslate">
	<title>blossom</title>
	<link rel="icon" type="image/png" href="/static/image/svg/favicon/free-icon-bold-5090971.svg">
	<link rel="stylesheet" href="/static/css/blossom.css?v=20260530_pagination_consistency1">
	<link rel="stylesheet" href="/static/css/system.css?v=20260528_dispose_modal1">
	<link rel="stylesheet" href="/static/css/3.access_control/access_control.css?v=20260528_audit_table_bg1">
	<link rel="stylesheet" href="/static/css/3.access_control/identity_governance.css?v=20260528_gov_modal_footer1">
	<script src="/static/js/blossom.js?v=20260529_search_empty1" defer></script>
	<script src="/static/js/3.access_control/3-2.identity_governance/3-2-3.audit/1.identity_audit.js?v=20260531_page_range1" defer></script>
	<script src="/static/js/3.access_control/access-modal-tabs.js?v=20260528_access_tabs4" defer></script>
</head>
<body>
	{% include 'layouts/_header.html' %}
	{% include 'layouts/_sidebar.html' %}
	<main class="main-content identity-page identity-audit-page">
		<div class="content-wrapper">
			<div class="page-header ac-page-header">
				<div class="page-utility-right" data-info-key="identity_governance.audit"></div>
				<div>
					<h1>통합계정 감사</h1>
					<p>계정 생성·삭제·권한 변경·계정 매핑·AD 동기화 이력을 확인합니다.</p>
				</div>
			</div>

			<section class="identity-panel">
				<div class="identity-panel-head">
					<div><h2>감사 이력 <span class="count-badge" id="identity-audit-count">0</span></h2></div>
					<div class="identity-toolbar" role="search">
						<input type="text" id="identity-audit-search" aria-label="감사 검색" placeholder="대상 계정·수행자·변경 내용 검색" autocomplete="off">
						<select id="identity-audit-action" aria-label="작업 유형 필터">
							<option value="">작업 전체</option>
							<option value="생성">생성</option>
							<option value="삭제">삭제</option>
							<option value="변경">변경</option>
							<option value="매핑">매핑</option>
							<option value="AD동기화">AD동기화</option>
						</select>
						<button type="button" class="identity-secondary-btn" id="identity-audit-refresh">새로고침</button>
					</div>
				</div>
				<div class="identity-table-wrap">
					<table class="identity-table">
						<thead>
							<tr>
								<th>작업 유형</th>
								<th>대상 계정</th>
								<th>수행자</th>
								<th>변경 내용</th>
								<th>시간</th>
							</tr>
						</thead>
						<tbody id="identity-audit-body"></tbody>
					</table>
				</div>
				<div id="identity-audit-empty" class="identity-empty" hidden>감사 이력이 없습니다.</div>
				<div class="identity-pagination" id="identity-audit-pagination">
					<span id="identity-audit-page-info">0-0 / 0개 항목</span>
					<div class="resource-page-actions">
						<button type="button" class="action-chip action-muted" id="identity-audit-prev">이전</button>
						<div class="resource-page-numbers" id="identity-audit-page-numbers" aria-label="감사 이력 페이지 번호"></div>
						<button type="button" class="action-chip action-muted" id="identity-audit-next">다음</button>
					</div>
				</div>
			</section>
		</div>
	</main>
</body>
</html>
